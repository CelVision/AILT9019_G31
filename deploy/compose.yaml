name: connectfour

services:
  game:
    image: connectfour:${CONNECTFOUR_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_ALLOWED_MODELS: ${AI_ALLOWED_MODELS:-}
      # Legacy aliases remain available while deployments migrate to AI_*.
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-}
      GLM_MODEL: ${GLM_MODEL:-}
      GLM_ALLOWED_MODELS: ${GLM_ALLOWED_MODELS:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-3.5}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
