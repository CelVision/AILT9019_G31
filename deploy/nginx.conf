# Nginx Reverse Proxy Configuration for ConnectFour Connect
# Path: /etc/nginx/sites-available/connectfour

server {
    listen 80;
    server_name connectfour.example.com; # Replace with production domain or VPS IP

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name connectfour.example.com;

    # SSL Certificate (managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/connectfour.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectfour.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static Client Assets
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Endpoint (/ws/game)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
