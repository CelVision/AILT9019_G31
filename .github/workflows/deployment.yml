name: Deployment verification

on:
  push:
    branches: [main, 'codex/deployment-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GLM_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: Python regression tests
        run: python -m pytest tests/ -q
      - name: Validate Compose and service configuration
        run: |
          docker compose config --quiet
          sudo mkdir -p /var/www/AILT9019_G31/server/venv/bin
          sudo ln -s /bin/true /var/www/AILT9019_G31/server/venv/bin/uvicorn
          systemd-analyze verify deploy/connectfour.service
      - name: Build and start the distribution
        run: |
          docker compose up --build --detach --wait --wait-timeout 120
          docker compose exec -T game sh -c 'test "$(id -u)" != 0 && test ! -e /app/server/.env'
      - name: Check HTTP and WebSocket delivery
        run: python deploy/check_public_url.py http://127.0.0.1:8000
      - name: Verify Nginx HTTPS and WSS with a test certificate
        run: |
          mkdir -p "$RUNNER_TEMP/connectfour-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/connectfour-tls/privkey.pem" \
            -out "$RUNNER_TEMP/connectfour-tls/fullchain.pem" \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          sed 's/connectfour.example.com/localhost/g' deploy/nginx.conf > "$RUNNER_TEMP/connectfour-nginx.conf"
          docker run --detach --name connectfour-proxy --network host \
            --volume "$RUNNER_TEMP/connectfour-nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$RUNNER_TEMP/connectfour-tls:/etc/letsencrypt/live/localhost:ro" \
            nginx:stable-alpine
          docker exec connectfour-proxy nginx -t
          for attempt in $(seq 1 30); do
            if curl --fail --silent --cacert "$RUNNER_TEMP/connectfour-tls/fullchain.pem" https://localhost/api/health > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/)" = 301
          SSL_CERT_FILE="$RUNNER_TEMP/connectfour-tls/fullchain.pem" python deploy/check_public_url.py https://localhost
      - name: Container logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail 100
          docker logs connectfour-proxy || true
      - name: Stop the distribution
        if: always()
        run: |
          docker rm --force connectfour-proxy || true
          docker compose down
